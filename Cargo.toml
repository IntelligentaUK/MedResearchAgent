[package]
name = "dementia-research-web"
version = "0.4.0"
edition = "2021"
description = "Security-hardened full-stack Rust web application for the Medical Research Agent (Dementia & Cancer autonomous literature discovery, 4-lens validation, and connection review)"
license = "MIT"
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"

[lib]
name = "dementia_research_web"
path = "src/lib.rs"

[[bin]]
name = "dementia-research-web"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "form", "query", "tokio", "matched-path"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "signal", "process"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["limit", "set-header", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.20"
sha2 = "0.10"
subtle = "2.6"
rand = "0.8"
uuid = { version = "1.12", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
regex = "1.11"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = { version = "9.3", default-features = false }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "test-util"] }
http-body-util = "0.1"
